name: Build Arcforge for Horizon

on:
  push:
    paths:
      - 'api/**'
      - 'content/**'
      - 'tools/**'
      - 'horizon-mixin.toml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'content/**'
      - 'tools/**'
      - 'horizon-mixin.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Arcforge
        uses: actions/checkout@v7

      - name: Check out pinned Horizon tooling
        uses: actions/checkout@v7
        with:
          repository: horizon-rust/horizon
          ref: fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca
          path: horizon-source

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path api/Cargo.toml

      - name: Install Horizon native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev libudev-dev

      - name: Check native mod crate
        run: cargo check --locked --manifest-path api/Cargo.toml

      - name: Build Horizon content pack
        working-directory: content
        run: cargo run --locked --manifest-path ../horizon-source/crates/cargo-horizon-mod/Cargo.toml -- build

      - name: Check Horizon content pack
        working-directory: content
        run: cargo run --locked --manifest-path ../horizon-source/crates/cargo-horizon-mod/Cargo.toml -- check target/horizon-mod/arcforge.hmod

      - name: Package native Horizon mod
        run: python3 tools/package_native_mod.py --source api --manifest horizon-mixin.toml --license-file LICENSE-Arcforge --notices-file THIRD_PARTY_NOTICES.md --horizon-source horizon-source --output target/arcforge.hnmod

      - name: Assemble complete mod artifact
        run: |
          mkdir -p target/arcforge-bundle
          cp content/target/horizon-mod/arcforge.hmod target/arcforge-bundle/
          cp target/arcforge.hnmod target/arcforge-bundle/
          cat > target/arcforge-bundle/INSTALL.txt <<'EOF'
          Arcforge for Horizon build

          Files:
          - arcforge.hmod: content pack (recipes, loot, tags, and other data)
          - arcforge.hnmod: native Rust mod source (registers items, blocks, and behavior)

          Install both files in Horizon. The native mod must then be built by Horizon for the
          player's installed Horizon version, operating system, and architecture. Horizon will
          ask the player to review and trust native code before building it. GitHub Actions
          checks the native crate and packages these files; it does not distribute a prebuilt
          Horizon client executable.
          EOF
          (cd target/arcforge-bundle && sha256sum arcforge.hmod arcforge.hnmod > SHA256SUMS)
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("target/arcforge-bundle")
          with ZipFile("target/arcforge-horizon-bundle.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.iterdir()):
                  archive.write(path, Path("arcforge-bundle") / path.name)
          PY

      - name: Upload complete mod artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arcforge-${{ github.sha }}
          path: |
            content/target/horizon-mod/arcforge.hmod
            target/arcforge.hnmod
            target/arcforge-horizon-bundle.zip
            target/arcforge-bundle/SHA256SUMS
          if-no-files-found: error

      - name: Summarize artifacts
        run: |
          {
            echo '### Arcforge build artifacts'
            echo '- `arcforge.hmod`: checked content pack.'
            echo '- `arcforge.hnmod`: native Rust source bundle, built against the pinned Horizon commit.'
            echo '- `arcforge-horizon-bundle.zip`: both installable mod files plus installation notes and checksums.'
            echo ''
            echo 'Horizon builds the native client locally for each installed game version and operating system after the player reviews and trusts the code. The mod source and content are both built and packaged by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
